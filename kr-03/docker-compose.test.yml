version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper-test
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-test
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-test:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  orders-db:
    image: postgres:17-alpine
    container_name: orders-db-test
    ports:
      - "5431:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: orders_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d orders_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  payments-db:
    image: postgres:17-alpine
    container_name: payments-db-test
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: payments_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d payments_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: test-runner
    depends_on:
      orders-db:
        condition: service_healthy
      payments-db:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - .:/app
      - ./coverage:/app/coverage
    environment:
      DATABASE_URL_ORDERS: "postgres://user:password@orders-db:5432/orders_db?sslmode=disable"
      DATABASE_URL_PAYMENTS: "postgres://user:password@payments-db:5432/payments_db?sslmode=disable"
      KAFKA_BROKERS: "kafka-test:9092"

  coverage-server:
    image: nginx:alpine
    container_name: coverage-server
    ports:
      - "8080:80"
    volumes:
      - ./coverage:/usr/share/nginx/html
    depends_on:
      - test-runner
