version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_started
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  db:
    image: postgres:17-alpine
    container_name: db
    ports:
      - "5431:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    volumes:
      - orders_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  orders-service:
    build: { context: ., dockerfile: cmd/orders-service/Dockerfile }
    container_name: orders-service
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      LISTEN_ADDR: ":8001"
      DATABASE_URL: "postgres://user:password@db:5432/db?sslmode=disable"
      KAFKA_BROKERS: "kafka:9092"

  payments-service:
    build: { context: ., dockerfile: cmd/payments-service/Dockerfile }
    container_name: payments-service
    ports:
      - "8002:8002"
    depends_on:
      db:
        condition: service_healthy
    environment:
      LISTEN_ADDR: ":8002"
      DATABASE_URL: "postgres://user:password@db:5432/db?sslmode=disable"
      KAFKA_BROKERS: "kafka:9092"

  api-gateway:
    image: krakend:latest
    container_name: api-gateway
    ports: ["8080:8080"]
    volumes: ["./gateway:/etc/krakend/"]
    command: ["run", "-d", "-c", "/etc/krakend/krakend.json"]

volumes:
  orders_data:
  payments_data:
