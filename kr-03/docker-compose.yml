version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  orders-db:
    image: postgres:17-alpine
    container_name: orders-db
    ports:
      - "5431:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: orders_db
    volumes:
      - orders_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d orders_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  payments-db:
    image: postgres:17-alpine
    container_name: payments-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: payments_db
    volumes:
      - payments_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d payments_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  orders-service:
    build:
      context: .
      dockerfile: cmd/orders-service/Dockerfile
    container_name: orders-service
    depends_on:
      orders-db:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8001:8001"
    environment:
      LISTEN_ADDR: ":8001"
      DATABASE_URL: "postgres://user:password@orders-db:5432/orders_db?sslmode=disable"
      KAFKA_BROKERS: "kafka:9092"

  payments-service:
    build:
      context: .
      dockerfile: cmd/payments-service/Dockerfile
    container_name: payments-service
    ports:
      - "8002:8002"
    depends_on:
      payments-db:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      LISTEN_ADDR: ":8002"
      DATABASE_URL: "postgres://user:password@payments-db:5432/payments_db?sslmode=disable"
      KAFKA_BROKERS: "kafka:9092"

  api-gateway:
    image: krakend:latest
    container_name: api-gateway
    volumes:
      - "./gateway:/etc/krakend/"
    command: [ "run", "-d", "-c", "/etc/krakend/krakend.json" ]
    depends_on:
      - orders-service
      - payments-service

  web-site:
    build:
      context: .
      dockerfile: cmd/client-app/Dockerfile
    container_name: web-site
    depends_on:
      - api-gateway
      - orders-service

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - orders-service

volumes:
  orders_db_data:
  payments_db_data:
